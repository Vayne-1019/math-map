  <h3>核心觀念</h3>
  <p>在頂點放上「質量」，讓每個分點都是兩端的平衡點：$m_B\cdot BD=m_C\cdot DC$。分點的質量等於兩端相加。這樣比例就變成加減法。</p>
  <h3>為什麼會想到</h3>
  <p>孟氏定理每次要選三角形和截線，題目一複雜就要寫好幾次。質點法把同一套比例「記在點上」，一次處理所有線段。它本質上就是孟氏定理的簿記方法。</p>
  <h3>常見卡點</h3>
  <ul><li><b>兩條線給出的質量對不上</b>：先各自設未知數，再用公共點的質量相等列方程，例題見下方 AMC 題。</li>
  <li>質點法適合求比，寫證明時建議改寫成 <a href="#u-G-3-1">G-3-1 孟氏定理</a>。</li></ul>
</template>

<template id="u-G-4-3">
  <h3>核心觀念</h3>
  <p>點 $P$ 對圓 $\omega$（圓心 $O$、半徑 $r$）的<b>冪</b>是 $PO^2-r^2$。過 $P$ 任意畫一條割線交圓於 $A$、$B$，都有 $PA\cdot PB=|PO^2-r^2|$。</p>
  <p>對兩個圓冪相等的點，會排成一條直線，叫<b>根軸</b>，它垂直於兩圓連心線。兩圓相交時，根軸就是公共弦所在的直線。</p>
  <h3>為什麼會想到</h3>
  <p>相交弦定理、割線定理、切線長定理，課本分三次教，其實是同一件事：$PA\cdot PB$ 不隨割線方向改變。把它變成一個只跟 $P$ 有關的數，就能拿來<b>比較兩個圓</b>，這是根軸的出發點。</p>
  <h3>定理與證明</h3>
  <p>設割線交圓於 $A$、$B$，$M$ 為 $AB$ 中點，則 $OM\perp AB$。</p>
  <div class="key"><b>關鍵一步</b>：用中點把乘積變成平方差（乘法公式 → <a href="#u-A-1-2">A-1-2</a>）。</div>
  $$PA\cdot PB=(PM-MA)(PM+MA)=PM^2-MA^2$$
  <p>再用兩次畢氏定理：$PM^2=PO^2-OM^2$、$MA^2=r^2-OM^2$，相減得 $PO^2-r^2$，與割線方向無關（$P$ 在圓內時取絕對值）。</p>
  <p><b>根軸是直線</b>：$PO_1^2-r_1^2=PO_2^2-r_2^2$ 等價於 $PO_1^2-PO_2^2=$ 常數。到兩定點距離平方差為常數的點，是一條垂直於 $O_1O_2$ 的直線（用坐標展開即可看出，見 <a href="#u-G-8-1">G-8-1</a>）。</p>
  <h3>辨識訊號</h3>
  <ul>
    <li>兩圓相交，公共弦上的點同時對兩圓有乘積關係。</li>
    <li>要證四點共圓：找一點 $P$，證 $PA\cdot PB=PC\cdot PD$（逆定理）。</li>
    <li>要證三線共點：把三條線看成三個圓兩兩的根軸，交點就是<b>根心</b>。</li>
  </ul>
  <h3>常見卡點</h3>
  <ul>
    <li><b>不會判斷四點共圓的其他方法</b> → <a href="#u-G-4-2">G-4-2 四點共圓的判定</a></li>
    <li><b>想不到哪個圓</b>：題目裡沒畫出來的圓，常常就是答案，例如以某線段為直徑的圓。</li>
  </ul>
  <h3>動手試試</h3>
  <p>拖動點 $P$ 或圓上的點 $T$ 改變割線方向。$PA\times PB$ 會一直等於 $|PO^2-r^2|$。</p>
  <div class="demo" data-demo="power"></div>
</template>

<template id="u-G-8-3">
  <h3>核心觀念</h3>
  <p>圓的標準式 $(x-h)^2+(y-k)^2=r^2$ 直接看出圓心和半徑；題目常給一般式 $x^2+y^2+Dx+Ey+F=0$，要先<b>配方</b>還原。</p>
  $$\left(x+\tfrac{D}{2}\right)^2+\left(y+\tfrac{E}{2}\right)^2=\frac{D^2+E^2-4F}{4}$$
  <div class="key"><b>卡在配方？</b> → <a href="#u-A-2-1">A-2-1 配方法</a>。$x$、$y$ 各自配方即可，互不干擾。</div>
  <h3>辨識訊號</h3>
  <ul><li>$x^2$ 與 $y^2$ 係數相同、沒有 $xy$ 項的二次方程，就是圓（或一點、或無圖形，看右邊正負）。</li></ul>
  <h3>和古典幾何的關係</h3>
  <p>把一般式左邊代入點 $P(x_0,y_0)$，得到的值正好是 $P$ 對這個圓的冪。所以根軸在坐標裡就是兩個圓方程相減，見 <a href="#u-G-4-3">G-4-3 圓冪與根軸</a>。</p>
</template>

<template id="u-A-2-1">
  <h3>核心觀念</h3>
  <p>把二次式寫成「平方 + 常數」：</p>
  $$x^2+bx=\left(x+\frac{b}{2}\right)^2-\frac{b^2}{4}$$
  <h3>為什麼會想到</h3>
  <p>平方是最好處理的東西：它非負，可以開根號，也能直接看出最小值。所以想辦法把一次項「吸收」進平方裡。</p>
  <div class="key"><b>關鍵一步</b>：展開 $(x+k)^2=x^2+2kx+k^2$，要讓 $2k=b$，所以 $k=\dfrac b2$；多出來的 $k^2$ 要減回去。</div>
  <h3>用在哪裡</h3>
  <ul>
    <li>一元二次方程的公式解 → <a href="#u-A-2-2">A-2-2</a></li>
    <li>二次函數的頂點與極值 → <a href="#u-A-5-2">A-5-2</a></li>
    <li>圓的一般式化標準式 → <a href="#u-G-8-3">G-8-3</a></li>
    <li>證明不等式：寫成平方和 ≥ 0 → <a href="#u-A-4-1">A-4-1</a></li>
  </ul>
  <h3>常見卡點</h3>
  <ul><li><b>首項係數不是 1</b>：先把 $x^2$ 的係數提出來再配，例如 $2x^2+6x=2\left(x^2+3x\right)$。</li>
  <li><b>忘記減回 $k^2$</b>：配完立刻展開檢查一次。</li></ul>
</template>

<template id="u-A-4-3">
  <h3>核心觀念</h3>
  $$\left(a_1^2+\cdots+a_n^2\right)\left(b_1^2+\cdots+b_n^2\right)\ge\left(a_1b_1+\cdots+a_nb_n\right)^2$$
  <p>競賽最常用的是它的分式形式（Engel 形式）：當 $y_i>0$，</p>
  $$\frac{x_1^2}{y_1}+\cdots+\frac{x_n^2}{y_n}\ge\frac{(x_1+\cdots+x_n)^2}{y_1+\cdots+y_n}$$
  <h3>為什麼會想到</h3>
  <p>「兩組數配對相乘再相加」跟「各自平方和」比大小。幾何上就是向量內積不超過長度相乘（→ <a href="#u-G-8-5">G-8-5</a>）。</p>
  <h3>定理與證明</h3>
  <div class="key"><b>關鍵一步</b>：構造一個對所有 $t$ 都不小於 0 的二次式。</div>
  $$f(t)=(a_1t-b_1)^2+\cdots+(a_nt-b_n)^2\ge0$$
  <p>展開後是 $t$ 的二次式，恆不小於 0，所以判別式 $\le 0$（→ <a href="#u-A-2-2">A-2-2 判別式</a>），整理就是柯西不等式。</p>
  <p>分式形式：令 $a_i=\dfrac{x_i}{\sqrt{y_i}}$、$b_i=\sqrt{y_i}$ 代入即得。</p>
  <h3>辨識訊號</h3>
  <ul><li>一串分式相加，分子像平方、分母是一次式。</li><li>等號成立時各項成比例，容易驗證。</li></ul>
  <h3>常見卡點</h3>
  <ul><li><b>分子不是平方</b>：先代換或上下同乘，把分子湊成平方 → <a href="#u-A-4-7">A-4-7 代換</a>，例題見 IMO 1995 第 2 題。</li></ul>
</template>

<template id="p-amc2004-10b-20-h"><p>已知的兩個比都在經過 $T$ 的兩條線上。哪個三角形被另一條線斜切過？</p></template>
<template id="p-amc2004-10b-20-s1">
  <p><b>想法</b>：把比例記在頂點的質量上，一次處理兩條線。</p>
  <p>設 $A$、$B$、$C$ 的質量為 $a$、$b$、$c$。$D$ 是 $B$、$C$ 的平衡點，質量 $b+c$；$E$ 是 $A$、$C$ 的平衡點，質量 $a+c$。</p>
  <p>在 $AD$ 上，$T$ 是平衡點：$a\cdot AT=(b+c)\cdot DT$，所以 $b+c=3a$。在 $BE$ 上：$a+c=4b$。</p>
  <p>兩式相減得 $b-a=3a-4b$，即 $5b=4a$。取 $a=5$、$b=4$，則 $c=11$。</p>
  <p>$\dfrac{CD}{BD}=\dfrac{b}{c}=\dfrac{4}{11}$。</p>

<template id="p-amc2004-10b-20-s2">
  <p><b>想法</b>：直線 $BE$ 斜切 $\triangle ADC$，直線 $AD$ 斜切 $\triangle BEC$，各用一次孟氏定理。</p>

  <p>截線 $A\!-\!T\!-\!D$ 截 $\triangle BEC$：$\dfrac{BT}{TE}\cdot\dfrac{EA}{AC}\cdot\dfrac{CD}{DB}=1$，即 $4\cdot\dfrac{1}{1+r}\cdot\dfrac{n}{m}=1$，所以 $r=\dfrac{4n-m}{m}$。</p>

let boards = [];
function css(v) { return getComputedStyle(document.documentElement).getPropertyValue(v).trim(); }
function makeBoard(el, bbox, extra) {
  el.id = 'jxg' + Math.random().toString(36).slice(2);
  el.classList.add('jxgbox');
  const b = JXG.JSXGraph.initBoard(el.id, Object.assign({ boundingbox: bbox, keepaspectratio: true, axis: false, showCopyright: false, showNavigation: false, pan: { enabled: false }, zoom: { enabled: false } }, extra || {}));
  boards.push(b);
  if (window.ResizeObserver) { let w0 = el.clientWidth; const ro = new ResizeObserver(() => { if (Math.abs(el.clientWidth - w0) < 2) return; w0 = el.clientWidth; try { b.resizeContainer(el.clientWidth, el.clientHeight, true, true); b.setBoundingBox(bbox, true); } catch (_) {} }); ro.observe(el); b._ro = ro; }
  return b;
}
function palette() { return { fg: css('--fg'), muted: css('--muted'), accent: css('--accent'), warm: css('--tA'), line: css('--line') }; }
function pt(b, xy, name, col, opt) { const c = palette(); return b.create('point', xy, Object.assign({ name, size: 4, strokeColor: col || c.fg, fillColor: col || c.fg, label: { strokeColor: c.fg, fontSize: 15, offset: [8, 8] } }, opt || {})); }

function addToggle(el, label, els) {
  let bar = el.querySelector('.tools');
  if (!bar) { bar = document.createElement('div'); bar.className = 'tools'; bar.style.marginTop = '8px'; el.appendChild(bar); }
  const btn = document.createElement('button'); btn.type = 'button'; btn.textContent = label; let on = false;
  btn.addEventListener('click', () => { on = !on; btn.classList.toggle('on', on); els.forEach(e => e.setAttribute({ visible: on })); });
  bar.appendChild(btn);
}
function readout(el) { const d = document.createElement('div'); d.className = 'readout'; el.appendChild(d); return d; }
const fx = x => isFinite(x) ? x.toFixed(3) : '—';
const PROBLEM_DEMOS = {
  'fig-circle'(el) {
    const c = palette(), box = document.createElement('div'); el.appendChild(box);
    const ax = { strokeColor: c.muted, ticks: { strokeColor: c.line, label: { strokeColor: c.muted, fontSize: 11 } } };
    const b = makeBoard(box, [-4, 4.5, 10, -8.5], { axis: true, defaultAxes: { x: ax, y: ax } });
    const O = pt(b, [3, -2], '(3, −2)', c.accent, { fixed: true });
    b.create('circle', [O, 5], { strokeColor: c.fg, strokeWidth: 2, fixed: true });
    const R = b.create('point', [8, -2], { visible: false });
    b.create('segment', [O, R], { strokeColor: c.warm, strokeWidth: 2, dash: 2, fixed: true });
    b.create('text', [5.1, -1.5, 'r = 5'], { strokeColor: c.warm, fontSize: 15, fixed: true });
  },
  'fig-amc'(el) {
    const c = palette(), box = document.createElement('div'); el.appendChild(box);

}

function amcItem(it) {

  if (!c) return viewNotFound();
  const prev = order[i - 1], next = order[i + 1];
  const secs = []; c.items.forEach(it => { const s = it.section || ''; if (!secs.length || secs[secs.length - 1].name !== s) secs.push({ name: s, items: [] }); secs[secs.length - 1].items.push(it); });
  const link = x => x ? `<a href="#amc-${x.no}">第 ${x.no} 章 ${esc(x.zh)}</a>` : '';
  return `${crumb(c.domain)}
  <div><h1><span class="mono" style="color:var(--d${c.domain})">第 ${c.no} 章</span> ${esc(c.zh)}${c.advanced ? '<span class="adv">難度提升</span>' : ''}</h1>
  <p class="lead">${esc(c.en)} · 原書第 ${c.pages[0]}–${c.pages[1]} 頁 · ${c.done === c.total ? `${c.total} 題已翻譯` : `已翻譯 ${c.done}/${c.total} 題`}</p>
  ${c.units.length ? `<div class="chips">對應單元：${c.units.map(u => `<a class="chip" href="#u-${u}">${u} ${esc(UNITS[u] ? UNITS[u].name : '')}</a>`).join('')}</div>` : ''}</div>
  ${c.intro ? `<section class="panel prose"><h3>這一章在做什麼</h3>${c.intro}</section>` : ''}
  ${secs.map(s => `<section class="ch-sec"><h2>${esc(s.name)}</h2>${s.items.map(amcItem).join('')}</section>`).join('')}
  <nav class="pager"><span>${prev ? '← ' + link(prev) : ''}</span><span>${next ? link(next) + ' →' : ''}</span></nav>`;
}

/* ===================== 書本（入口一）與單元消化版（入口二） ===================== */
const loaded = {};
function need(src, ok) {  // lazy <script>; true when ready
  if (ok()) return true;
  if (!loaded[src]) {
    loaded[src] = 'loading';
    const s = document.createElement('script'); s.src = src;
    s.onload = () => { loaded[src] = 'ok'; route(true); };
    s.onerror = () => { loaded[src] = 'fail'; route(true); };
    document.head.appendChild(s);
  }
  return false;
}
const waitMsg = src => loaded[src] === 'fail' ? `<p class="lead warn">資料載入失敗，請重新整理頁面。</p>` : `<p class="lead">載入中…</p>`;
const BOOKS = { cz: '初中數學競賽教程', gz: '高中數學競賽教程' };
function entries(on) {
  return `<div class="entries">
    <a class="entry${on === 'books' ? ' on' : ''}" href="#books"><span class="k">入口一</span><b>書本順序</b><span>照原書一講一講讀，步驟展開、附圖補齊。</span></a>
    <a class="entry${on === 'map' ? ' on' : ''}" href="#map"><span class="k">入口二</span><b>單元地圖</b><span>消化後的重點圖卡，依單元整理；覺得不顯然就點 ▼ 展開。</span></a></div>`;
}
function bookReady(id) { return need(`books/${id}.js`, () => window.BOOK_DATA && window.BOOK_DATA[id]); }

function viewBooks() {
  const ids = Object.keys(BOOKS), ready = ids.map(bookReady).every(Boolean);
  const head = `<div><h1>書本</h1><p class="lead">把競賽教程「解壓縮」：保留原書的講次順序，補上省略的步驟與附圖，數學式全部重新排版。講解與詳解由本站重寫，題目標明原書出處。</p></div>${entries('books')}`;
  if (!ready) return head + waitMsg(`books/${ids.find(i => !(window.BOOK_DATA && window.BOOK_DATA[i]))}.js`);
  return head + ids.map(id => { const B = window.BOOK_DATA[id], n = B.lectures.filter(l => l.blocks.length).length;
    return `<section class="panel"><div class="bankhead"><h2><a href="#book-${id}">${esc(B.title)}</a></h2><span class="note">${n}／${B.lectures.length} 講已編譯</span></div>
      <p class="note">${esc(B.editors || '')}${B.publisher ? '・' + esc(B.publisher) : ''}</p>
      <div class="chips">${B.parts.map(p => `<a class="chip" href="#book-${id}">${esc(p.name)}（第 ${p.from}–${p.to} 講）</a>`).join('')}</div></section>`; }).join('');
}
function viewBook(id) {
  if (!BOOKS[id]) return viewNotFound();
  const crumb = `<div class="crumb"><a href="#books">書本</a><span>›</span><span>${BOOKS[id]}</span></div>`;
  if (!bookReady(id)) return crumb + waitMsg(`books/${id}.js`);
  const B = window.BOOK_DATA[id];
  return `${crumb}<div><h1>${esc(B.title)}</h1><p class="lead">${esc(B.editors || '')}${B.publisher ? '・' + esc(B.publisher) : ''}</p></div>
  ${B.parts.map(p => `<section class="panel"><h2>${esc(p.name)}</h2><ol class="lec">${B.lectures.filter(l => l.no >= p.from && l.no <= p.to).map(l => {
    const has = l.blocks.length;
    return `<li><span class="no">第 ${l.no} 講</span><span><a href="#book-${id}-${l.no}"${has ? ' style="font-weight:700"' : ' class="todo"'}>${esc(l.title)}</a>${l.author ? ` <span class="note">${esc(l.author)}</span>` : ''}</span>
      <span class="st${has && l.status === '完成' ? ' ok' : ''}">${has ? esc(l.status) : '待編譯'}</span></li>`; }).join('')}</ol></section>`).join('')}`;
}
const THM_KINDS = ['定理', '定義', '引理', '性質', '公式', '推論'];
function bookBlock(b) {
  const lab = [b.kind, b.label].filter(Boolean).join(' ');
  if (b.kind === 'text') return `<section class="panel prose bk-text">${b.html}</section>`;
  if (THM_KINDS.includes(b.kind))
    return `<div class="item thm"><div class="ih"><b>${esc(lab)}${b.title ? '：' + esc(b.title) : ''}</b></div><div class="body">${b.zh || ''}</div>${b.sol ? `<details><summary>證明</summary><div>${b.sol}</div></details>` : ''}</div>`;
  const isEx = b.kind === '例';
  return `<div class="item"><div class="ih"><b>${esc(lab)}</b>${b.title ? `<span>${esc(b.title)}</span>` : ''}${b.src ? `<span class="srcchip">${esc(b.src)}</span>` : ''}</div>
    <div class="body">${b.zh || ''}</div>
    ${b.hint ? `<details><summary>提示</summary><div>${b.hint}</div></details>` : ''}
    ${b.sol ? `<details${isEx ? ' open' : ''}><summary>${isEx ? '解' : '解答'}</summary><div>${b.sol}</div></details>` : ''}
    ${b.ans ? `<details><summary>答案</summary><div>${b.ans}</div></details>` : ''}</div>`;
}
function viewLecture(id, no) {
  if (!BOOKS[id]) return viewNotFound();
  const crumb = `<div class="crumb"><a href="#books">書本</a><span>›</span><a href="#book-${id}">${BOOKS[id]}</a></div>`;
  if (!bookReady(id)) return crumb + waitMsg(`books/${id}.js`);
  const B = window.BOOK_DATA[id], L = B.lectures.find(l => l.no === no); if (!L) return viewNotFound();
  const prev = B.lectures.find(l => l.no === no - 1), next = B.lectures.find(l => l.no === no + 1);
  const lk = l => `<a href="#book-${id}-${l.no}">第 ${l.no} 講 ${esc(l.title)}</a>`;
  return `${crumb}<div><h1><span class="mono">第 ${no} 講</span> ${esc(L.title)}</h1>
    <p class="lead">${L.author ? esc(L.author) + '・' : ''}原書 PDF 第 ${esc(L.pages || L.page)} 頁${L.blocks.length ? '・' + esc(L.status) : ''}</p>
    ${L.units && L.units.length ? `<div class="chips">對應單元：${L.units.map(u => `<a class="chip" href="#u-${u}">${u} ${esc(UNITS[u] ? UNITS[u].name : '')}</a>`).join('')}</div>` : ''}</div>
  ${L.blocks.length ? L.blocks.map(bookBlock).join('') : `<section class="panel"><p class="lead">這一講還在編譯。</p></section>`}
  <nav class="pager"><span>${prev ? '← ' + lk(prev) : ''}</span><span>${next ? lk(next) + ' →' : ''}</span></nav>`;
}
function digestForUnit(code) {
  if (!need('books/digest.js', () => window.UNIT_DIGEST)) return '';
  const ds = window.UNIT_DIGEST[code] || [];
  const srcName = f => { const m = /^(cz|gz)-L(\d+)$/.exec(f); return m ? `<a href="#book-${m[1]}-${+m[2]}">${BOOKS[m[1]]}第 ${+m[2]} 講</a>` : esc(f); };
  return ds.map(d => `<section class="panel digest">${d.title ? `<h2>${esc(d.title)}</h2>` : ''}${d.html}<div class="from">出處：${srcName(d.from)}</div></section>`).join('');
}
app.addEventListener('click', e => {
  const b = e.target.closest('.obt'); if (!b) return;
  const x = b.nextElementSibling, open = b.getAttribute('aria-expanded') !== 'true';
  b.setAttribute('aria-expanded', open); x.hidden = !open;
  if (open && window.MathJax && MathJax.typesetPromise) MathJax.typesetPromise([x]).catch(() => {});
});

/* ===================== ROUTER ===================== */
function route(keep) {
  boards.forEach(b => { try { if (b._ro) b._ro.disconnect(); JXG.JSXGraph.freeBoard(b); } catch (_) {} }); boards = [];
  const h = (location.hash || '#home').slice(1);
  let html, key = h;
  if (h === 'home' || h === '') html = viewHome();
  else if (h === 'map') html = viewMap();
  else if (h === 'exams') html = viewExams();
  else if (h === 'board') html = viewBoard();
  else if (h === 'sources') html = viewSources();
  else if (h === 'basic') html = viewBasic();
  else if (h === 'books') html = viewBooks();
  else if (/^book-(cz|gz)$/.test(h)) { html = viewBook(h.slice(5)); key = 'books'; }
  else if (/^book-(cz|gz)-\d+$/.test(h)) { const [, id, n] = h.split('-'); html = viewLecture(id, +n); key = 'books'; }
  else if (h === 'amc') html = viewAmcIndex();
  else if (/^amc-\d+$/.test(h)) { html = viewAmcChapter(+h.slice(4)); key = 'amc'; }
  else if (h.startsWith('u-')) { html = viewUnit(h.slice(2)); key = 'map'; }
  else if (h.startsWith('p-')) { html = viewProblem(h.slice(2)); key = 'exams'; }
  else if (h === 'bank-AMC') { html = viewBankAMC(); key = 'exams'; }
  else if (/^bank-(IMO|APMO)-\d{4}$/.test(h)) { const [, k, y] = h.split('-'); html = viewBankYear(k, +y); key = 'exams'; }
  else html = viewNotFound();
  app.innerHTML = html;
  document.querySelectorAll('#nav a').forEach(a => a.classList.toggle('on', a.dataset.k === key));
  if (keep !== true) window.scrollTo(0, 0);
  if (window.JXG) app.querySelectorAll('.demo').forEach(el => { const f = DEMOS[el.dataset.demo]; if (f) try { f(el); } catch (err) { el.textContent = '互動圖載入失敗：' + err.message; } });
  else app.querySelectorAll('.demo').forEach(el => { el.textContent = '互動圖需要網路載入繪圖元件。'; });
  if (window.MathJax && MathJax.typesetPromise) MathJax.typesetPromise([app]).catch(() => {});
}
window.addEventListener('hashchange', () => route());
function boot() { route(); }
if (window.MathJax && MathJax.startup && MathJax.startup.promise) MathJax.startup.promise.then(boot); else boot();
</script>
